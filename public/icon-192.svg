<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B141A" />
      <stop offset="100%" stop-color="#111B21" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00A884" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2A3942" stroke-width="12" />
  
  <!-- Chat Bubble Outline -->
  <path d="M128 176 C 128 128, 384 128, 384 176 C 384 270, 310 290, 260 290 L 220 330 L 220 290 C 148 290, 128 250, 128 176 Z" 
        fill="#1F2C34" stroke="url(#glowGrad)" stroke-width="14" stroke-linejoin="round" />

  <!-- Code Terminal Brackets: >_ inside bubble -->
  <path d="M190 190 L 230 220 L 190 250" fill="none" stroke="#00FF66" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="255" y1="250" x2="315" y2="250" stroke="#00FF66" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

  <!-- Secret Key / ACK Dot -->
  <circle cx="340" cy="180" r="16" fill="#FFB800" />
</svg>
